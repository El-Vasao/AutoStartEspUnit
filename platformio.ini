[env:esp32c3]
platform = espressif32 @ 6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.filesystem = littlefs
board_build.flash_mode = dio
board_build.f_cpu = 80000000L

; SoftAP UI + SIM800 on UART0 (GPIO20/21). Debug Serial shares that UART (legacy).
lib_deps =
    ESP32Async/ESPAsyncWebServer @ 3.9.5
    milesburton/DallasTemperature

build_flags =
    -std=gnu++17
    -O2
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -fno-exceptions
    -fno-rtti
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D GSM_MODEM_ECHO=0
    -D SSE_MAX_QUEUED_MESSAGES=21

build_unflags =
    -std=gnu++11
    -std=c++11

monitor_filters =
    esp32_exception_decoder

; Host-side smoke tests (protocol constants / contracts). Full MqttFsmClient framing
; tests require Arduino Client stubs — see docs/modules/gsm_modem.md field checklist.
[env:native]
platform = native
test_framework = unity
test_build_src = false
build_flags =
    -std=c++17
    -DUNIT_TEST
