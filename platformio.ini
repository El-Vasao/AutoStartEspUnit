; Firmware is the default Build target. Host Unity suites: `pio test -e native`.
[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32 @ 6.9.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
upload_speed = 921600

board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.filesystem = littlefs
board_build.flash_mode = dio
board_build.f_cpu = 80000000L

; SoftAP UI + SIM800 on UART0 (GPIO20/21). Diagnostic log TX on UART1 (GPIO7).
lib_deps =
    ESP32Async/ESPAsyncWebServer @ 3.9.5
    milesburton/DallasTemperature

build_flags =
    -std=gnu++17
    -O2
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -fno-exceptions
    -fno-rtti
    ; USB_MODE=1 уже из board XIAO; CDC с board снимается в build_unflags.
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D GSM_MODEM_ECHO=0
    -D SSE_MAX_QUEUED_MESSAGES=21

build_unflags =
    -std=gnu++11
    -std=c++11
    ; XIAO board.json даёт CDC=1 — снимаем; ниже оставляем CDC=0 (SIM800 на UART0).
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_filters =
    esp32_exception_decoder

extra_scripts = pre:scripts/ensure_version_h.py

; Host Unity suites (test/test_*/): pure logic + real firmware modules on stubs (test/stubs/).
; Every production file a suite needs is listed in build_src_filter. See docs/TESTING.md.
[env:native]
platform = native
test_framework = unity
test_build_src = true
extra_scripts =
    pre:scripts/ensure_version_h.py
    pre:test/native_pre.py
build_src_filter =
    -<**/*>
    +<gsm/GsmAtParse.cpp>
    +<gsm/GsmTimeParse.cpp>
    +<gsm/GsmController.Core.cpp>
    +<gsm/GsmController.Voice.cpp>
    +<gsm/GsmController.Urc.cpp>
    +<gsm/GsmController.Diagnostics.cpp>
    +<gsm/GsmController.Bringup.cpp>
    +<gsm/GsmController.Fsm.Init.cpp>
    +<gsm/GsmController.Fsm.Registration.cpp>
    +<gsm/GsmController.Fsm.Gprs.cpp>
    +<modem/Sim800TcpTransport.cpp>
    +<mqtt/MqttCommandParser.cpp>
    +<mqtt/MqttClient.Commands.cpp>
    +<mqtt/MqttWire.cpp>
    +<mqtt/MqttFsmClient.cpp>
    +<program/ProgramAction.cpp>
    +<program/ProgramExecutor.Core.cpp>
    +<program/ProgramExecutor.Execute.cpp>
    +<program/ProgramExecutor.Starter.cpp>
    +<program/ProgramValidate.cpp>
    +<program/StarterMachine.cpp>
    +<config/VehicleRules.cpp>
    +<config/JsonScalar.cpp>
    +<config/SensorRomResolve.cpp>
    +<config/Config.BaseSax.cpp>
    +<config/Config.BaseJsonEmit.cpp>
    +<config/Config.ProgramJsonIo.cpp>
    +<json/JsonParseFile.cpp>
    +<io/RpmEstimator.cpp>
    +<io/RelayController.cpp>
    +<io/DigitalInputs.cpp>
    +<core/BatterySaverManager.cpp>
    +<../test/stubs/SensorTimeFakes.cpp>
    +<modem/Sim800Lines.cpp>
    +<modem/AtSession.cpp>
    +<modem/ModemUart.cpp>
    +<core/TriggerRules.cpp>
    +<core/ErrorManager.cpp>
    +<fs/FsManager.Core.cpp>
    +<fs/FsManager.Atomic.cpp>
    +<fs/FsManager.Health.cpp>
    +<ota/OtaHandler.Core.cpp>
    +<ota/OtaHandler.Stream.cpp>
    +<common/Logger.cpp>
    +<common/JsonEscape.cpp>
    +<common/Crc16.cpp>
    +<common/Fnv1a.cpp>
    +<mqtt/HwMapJson.cpp>
    +<mqtt/MqttStatusBuilder.cpp>
    +<web/WebServer.SseBuilders.cpp>
    ; lib/JsonStreamingParser declares espressif/avr platforms only, so LDF skips it here.
    +<../lib/JsonStreamingParser/JsonStreamingParser.cpp>
    +<../test/stubs/LogSink.cpp>
    +<../test/stubs/native_run_main.cpp>
    +<../test/stubs/NativeHostDeps.cpp>
build_flags =
    -std=c++17
    -DUNIT_TEST
    -I test/stubs
    -I lib/JsonStreamingParser
    ; BaseConfig и соседние фреймы на стеке в Unity; дефолтный 1 МБ MinGW не хватает.
    -Wl,--stack,8388608
