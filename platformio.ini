; Firmware is the default Build target. Host Unity suites: `pio test -e native`.
[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32 @ 6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.filesystem = littlefs
board_build.flash_mode = dio
board_build.f_cpu = 80000000L

; SoftAP UI + SIM800 on UART0 (GPIO20/21). Debug Serial shares that UART.
lib_deps =
    ESP32Async/ESPAsyncWebServer @ 3.9.5
    milesburton/DallasTemperature

build_flags =
    -std=gnu++17
    -O2
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -fno-exceptions
    -fno-rtti
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D GSM_MODEM_ECHO=0
    -D SSE_MAX_QUEUED_MESSAGES=21

build_unflags =
    -std=gnu++11
    -std=c++11

monitor_filters =
    esp32_exception_decoder

extra_scripts = pre:scripts/ensure_version_h.py

; Host Unity suites (test/test_*/): pure logic + real firmware modules on stubs (test/stubs/).
; Every production file a suite needs is listed in build_src_filter. See docs/TESTING.md.
[env:native]
platform = native
test_framework = unity
test_build_src = true
extra_scripts =
    pre:scripts/ensure_version_h.py
    pre:test/native_pre.py
build_src_filter =
    -<**/*>
    +<gsm/GsmAtParse.cpp>
    +<gsm/GsmTimeParse.cpp>
    +<mqtt/MqttCommandParser.cpp>
    +<mqtt/MqttWire.cpp>
    +<mqtt/MqttFsmClient.cpp>
    +<program/ProgramAction.cpp>
    +<program/ProgramValidate.cpp>
    +<program/StarterMachine.cpp>
    +<config/VehicleRules.cpp>
    +<config/JsonScalar.cpp>
    +<config/SensorRomResolve.cpp>
    +<io/RpmEstimator.cpp>
    +<modem/Sim800Lines.cpp>
    +<modem/AtSession.cpp>
    +<modem/ModemUart.cpp>
    +<core/TriggerRules.cpp>
    +<core/ErrorManager.cpp>
    +<common/Logger.cpp>
    +<common/JsonEscape.cpp>
    +<common/Crc16.cpp>
    ; lib/JsonStreamingParser declares espressif/avr platforms only, so LDF skips it here.
    +<../lib/JsonStreamingParser/JsonStreamingParser.cpp>
    +<../test/stubs/LogSink.cpp>
    +<../test/stubs/native_run_main.cpp>
build_flags =
    -std=c++17
    -DUNIT_TEST
    -I test/stubs
    -I lib/JsonStreamingParser
